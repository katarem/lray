# Configuración de GoReleaser v2: https://goreleaser.com
version: 2
project_name: lray

before:
  hooks:
    - go mod tidy

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Nombres sin versión para que install.sh pueda usar releases/latest/download
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Fórmula de Homebrew en un repo aparte (tu-usuario/homebrew-tap).
# Si no vas a usar Homebrew, borra este bloque entero.
brews:
  - repository:
      owner: tu-usuario
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/tu-usuario/lray
    description: Gestiona entornos Liferay desde la terminal
    install: |
      bin.install "lray"
      generate_completions_from_executable(bin/"lray", "completion")
    test: |
      system "#{bin}/lray", "--version"
