name: release

# Se publica solo al fusionar en main una VERSION nueva (ci.yml crea el tag y
# llama a este workflow). Subir a mano un tag vX.Y.Z también lo lanza; tiene
# que coincidir con VERSION.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag que publicar (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Comprobar que el tag coincide con VERSION
        run: |
          v="v$(tr -d ' \t\r\n' < VERSION)"
          if [ "$TAG" != "$v" ]; then
            echo "::error file=VERSION::el tag $TAG no coincide con VERSION ($v)"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
